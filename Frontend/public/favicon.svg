<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Soft Drop Shadow for the outer element -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#b64849" flood-opacity="0.3"/>
    </filter>
    
    <!-- Claymorphism Inner Shadows -->
    <filter id="clay-inner" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Top-left light reflection -->
      <feOffset dx="-4" dy="-4" in="SourceAlpha" result="light-offset"/>
      <feGaussianBlur stdDeviation="3" in="light-offset" result="light-blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.7" result="light-color"/>
      <feComposite operator="in" in="light-color" in2="light-blur" result="light-shadow"/>
      <feComposite operator="out" in="light-shadow" in2="SourceAlpha" result="light-inverse"/>
      
      <!-- Bottom-right dark shadow -->
      <feOffset dx="4" dy="4" in="SourceAlpha" result="dark-offset"/>
      <feGaussianBlur stdDeviation="4" in="dark-offset" result="dark-blur"/>
      <feFlood flood-color="#b64849" flood-opacity="0.7" result="dark-color"/>
      <feComposite operator="in" in="dark-color" in2="dark-blur" result="dark-shadow"/>
      <feComposite operator="out" in="dark-shadow" in2="SourceAlpha" result="dark-inverse"/>
      
      <!-- Combine shadows over graphic -->
      <feComposite operator="over" in="light-inverse" in2="dark-inverse" result="inner-shadows"/>
      <feComposite operator="in" in="inner-shadows" in2="SourceGraphic" result="inner-shadows-masked"/>
      
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="inner-shadows-masked"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base rounded rectangle with drop shadow -->
  <rect x="10" y="10" width="80" height="80" rx="25" fill="#ec7a7b" filter="url(#drop-shadow)" />
  <!-- Identical shape with clay inner shadows -->
  <rect x="10" y="10" width="80" height="80" rx="25" fill="#ec7a7b" filter="url(#clay-inner)" />
  
  <!-- Microphone Icon -->
  <g fill="#ffffff" transform="translate(0, -1)">
    <path d="M 50 25 C 43.5 25 38 30.5 38 37 L 38 53 C 38 59.5 43.5 65 50 65 C 56.5 65 62 59.5 62 53 L 62 37 C 62 30.5 56.5 25 50 25 Z" />
    <path d="M 33 53 C 33 62 39.5 69.5 48 71.5 L 48 80 L 52 80 L 52 71.5 C 60.5 69.5 67 62 67 53 L 63 53 C 63 60 57.5 66 50 66 C 42.5 66 37 60 37 53 Z" />
  </g>
</svg>